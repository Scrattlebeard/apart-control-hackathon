[project]
name = "goap-control"
version = "0.1.0"
description = "GOAP planning as a structural defense for AI agents, evaluated on AgentDojo via ControlArena"
requires-python = ">=3.11"
dependencies = [
    "control_arena @ file:///workspace/control-arena",
    "inspect-ai>=0.3.159",
    "shade-arena",
]

[dependency-groups]
dev = ["ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/goap"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.uv.sources]
shade-arena = { git = "https://github.com/rasmusfaber/SHADE-Arena.git", rev = "wheels" }
